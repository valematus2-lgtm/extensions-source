name: Build NovelCool Fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply NovelCool fix
        run: python3 novelcool_fix.py
      - name: Build JAR
        run: ./gradlew spotlessApply :src:all:novelcool:assembleRelease --no-daemon
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: NovelCool-Fix-experimental
          path: src/all/novelcool/build/outputs/jar/release/*.jar
          if-no-files-found: error
